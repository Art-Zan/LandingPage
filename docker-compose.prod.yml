# Dono: onda de deploy (Docker/VPS). Guia completo: deploy/README.md.
#
# Produção/homologação numa VPS COMPARTILHADA: app (Next + Payload) + Postgres 16.
# O HTTPS, os certificados e o proxy reverso ficam no Caddy único da VPS (o "edge",
# /srv/edge); este projeto não tem Caddy. Contrato: CLAUDE-arquitetura-vps.md (repo da VPS).
#
#   Internet ──> edge (Caddy, 80/443) ──rede "edge", alias artzan-app──> app :3000
#                                                                         │
#                                                    rede "privada" (internal) ──> db :5432
#
# O docker-compose.yml da raiz continua sendo só o Postgres de DESENVOLVIMENTO.
#
# O .env da raiz (copiado de .env.production.example) é lido sozinho pelo compose, para a
# interpolação e para o container `app` (env_file). Ele traz COMPOSE_FILE, então basta
#   docker compose <comando>
# na raiz do projeto (ou `docker compose -f docker-compose.prod.yml <comando>`).

name: artzan

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artzan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-artzan}
    # Sem `ports`: o banco só é acessível pela rede privada do projeto (sem saída para a internet).
    networks:
      - privada
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: artzan/app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # Montado aqui para que a senha exista num lugar só (POSTGRES_PASSWORD).
      DATABASE_URI: postgres://${POSTGRES_USER:-artzan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-artzan}
      DB_ADAPTER: postgres
      NODE_ENV: production
      # Padrão seguro até o conteúdo real existir (dev/CONVENCOES.md §7).
      SITE_MODE: ${SITE_MODE:-homolog}
      SOLICITACOES_DIR: /app/var/solicitacoes
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=2048}
    depends_on:
      db:
        condition: service_healthy
    # Sem `ports`: só o edge fala com o app, pela rede `edge` (alias único na VPS toda).
    # A saída para a internet (SMTP, fontes, webhook de alerta) também vem da `edge`:
    # a `privada` é internal.
    networks:
      privada:
      edge:
        aliases: [artzan-app]
    expose:
      - '3000'
    volumes:
      - midia:/app/midia
      - solicitacoes:/app/var/solicitacoes
      - next-cache:/app/.next/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      # O build roda na subida (deploy/entrypoint.sh) e pode levar vários minutos.
      start_period: 15m
    logging: *logging

# Nomes fixos: o script de backup e a restauração referenciam estes volumes.
volumes:
  pgdata:
    name: artzan_pgdata
  midia:
    name: artzan_midia
  solicitacoes:
    name: artzan_solicitacoes
  next-cache:
    name: artzan_next_cache

networks:
  # Entre app e db. Sem saída para a internet: só o app fala com o banco.
  privada:
    internal: true
  # Compartilhada com o edge (Caddy único da VPS). Criada uma vez: docker network create edge
  edge:
    external: true
