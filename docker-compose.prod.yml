# Dono: onda de deploy (Docker/VPS). Guia completo: deploy/README.md.
#
# Produção/homologação numa VPS: app (Next + Payload) + Postgres 16 + Caddy.
# O docker-compose.yml da raiz continua sendo só o Postgres de DESENVOLVIMENTO.
#
# Sempre invocar com o arquivo de ambiente, que também alimenta a interpolação:
#   docker compose --env-file deploy/.env.production -f docker-compose.prod.yml <comando>

name: artzan

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artzan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env.production}
      POSTGRES_DB: ${POSTGRES_DB:-artzan}
    # Sem `ports`: o banco só é acessível pela rede interna do compose.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: artzan-site:latest
    restart: unless-stopped
    init: true
    env_file:
      - deploy/.env.production
    environment:
      # Montado aqui para que a senha exista num lugar só (POSTGRES_PASSWORD).
      DATABASE_URI: postgres://${POSTGRES_USER:-artzan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-artzan}
      DB_ADAPTER: postgres
      NODE_ENV: production
      # Padrão seguro até o conteúdo real existir (dev/CONVENCOES.md §7).
      SITE_MODE: ${SITE_MODE:-homolog}
      SOLICITACOES_DIR: /app/var/solicitacoes
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=2048}
    depends_on:
      db:
        condition: service_healthy
    # Sem `ports`: só o Caddy fala com o app, pela rede interna.
    expose:
      - '3000'
    volumes:
      - midia:/app/midia
      - solicitacoes:/app/var/solicitacoes
      - next-cache:/app/.next/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      # O build roda na subida (deploy/entrypoint.sh) e pode levar vários minutos.
      start_period: 15m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?defina SITE_DOMAIN em deploy/.env.production}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL em deploy/.env.production}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      # Só "started": o Caddy obtém o certificado enquanto o app ainda builda.
      - app
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

# Nomes fixos: o script de backup e a restauração referenciam estes volumes.
volumes:
  pgdata:
    name: artzan_pgdata
  midia:
    name: artzan_midia
  solicitacoes:
    name: artzan_solicitacoes
  next-cache:
    name: artzan_next_cache
  caddy-data:
    name: artzan_caddy_data
  caddy-config:
    name: artzan_caddy_config
