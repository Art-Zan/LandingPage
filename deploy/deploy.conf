# Lido pelo script `site` da VPS (contrato: CLAUDE-arquitetura-vps.md, repo da VPS).
# Guia deste projeto: deploy/README.md.
SLUG="artzan" # = name: do docker-compose.prod.yml (não mude: os volumes artzan_* dependem dele)
DOMAIN_VARS="SITE_DOMAIN WWW_DOMAIN"
# As com `:?` no compose (POSTGRES_PASSWORD) + as que o entrypoint exige (PAYLOAD_SECRET,
# NEXT_PUBLIC_SITE_URL) + os domínios do site.caddy.
REQUIRED_VARS="SITE_DOMAIN WWW_DOMAIN NEXT_PUBLIC_SITE_URL POSTGRES_PASSWORD PAYLOAD_SECRET"
# `openssl rand -hex 32` gera 64 caracteres, que é o mínimo do entrypoint (`-lt 64` recusa só <64).
SECRET_VARS="POSTGRES_PASSWORD PAYLOAD_SECRET"
# A home renderiza a página inteira, mas o contrato aceita; o healthcheck do compose usa a mesma.
HEALTH_URLS='https://${SITE_DOMAIN}/'
BACKUP_CMD="deploy/backup.sh"
# BACKUP_CRON="0 3 * * *"

# Sem ganchos: o entrypoint do app já aplica as migrations e builda na subida
# (por isso o `site novo`/`site atualizar` pode esperar até ~15 min o app ficar healthy).
# O seed de homologação é MANUAL e nunca automático (deploy/README.md, "Seed de homologação").
